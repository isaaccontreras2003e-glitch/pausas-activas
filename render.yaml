# Despliegue en Render (https://render.com) → New → Blueprint → elegir este repositorio.
# Crea un servidor web con disco permanente para la base de datos y las copias de seguridad diarias.
services:
  - type: web
    name: pausas-activas
    runtime: node
    region: virginia
    # El plan gratuito no tiene disco permanente (se borrarían los datos) y se apaga sin uso.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /api/salud
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.13.1
      - key: DB_PATH
        value: /var/data/pausas.db
      # Render está delante como proxy: así se obtiene la IP real de cada persona (límites de intentos).
      - key: TRUST_PROXY
        value: "1"
      # Clave para la configuración inicial (crear la primera cuenta o importar datos). Render la genera;
      # se ve en el panel de Render → pausas-activas → Environment.
      - key: CLAVE_CONFIGURACION
        generateValue: true
